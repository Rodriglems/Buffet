<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0a0a0a" />
    <title>Sem conexão — Mesly</title>
    <link rel="icon" href="/icons/favicon-32.png" type="image/png" />
    <style>
      :root {
        color-scheme: light;
        font-family:
          "Plus Jakarta Sans",
          system-ui,
          -apple-system,
          "Segoe UI",
          sans-serif;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        background: #f4f5f7;
        color: #111;
      }
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }
      .cartao {
        max-width: 380px;
        width: 100%;
        background: #fff;
        border-radius: 20px;
        padding: 32px 24px;
        text-align: center;
        box-shadow: 0 1px 2px rgb(0 0 0 / 6%);
        border: 1px solid rgb(0 0 0 / 6%);
      }
      img {
        width: 56px;
        height: 56px;
      }
      h1 {
        font-size: 1.25rem;
        margin: 16px 0 8px;
      }
      p {
        margin: 0;
        color: #555;
        font-size: 0.9rem;
        line-height: 1.5;
      }
      button {
        margin-top: 24px;
        border: 0;
        border-radius: 10px;
        padding: 12px 20px;
        background: #0a0a0a;
        color: #fff;
        font: inherit;
        font-weight: 600;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main class="cartao">
      <img src="/icons/icon-192.png" alt="" />
      <h1>Sem conexão com a internet</h1>
      <p>
        O Mesly precisa de internet para mostrar seus eventos, orçamentos e pagamentos sempre
        atualizados. Verifique sua conexão e tente de novo.
      </p>
      <button type="button" onclick="location.reload()">Tentar de novo</button>
    </main>
  </body>
</html>
